# Fly.io config for the online game server. See docs/ONLINE.md for the steps.
# Pick your own unique app name; it becomes <name>.fly.dev.
app = "my-dominoes"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATABASE = "/data/domino.db"

# Games are stored in SQLite on this volume.
[[mounts]]
  source = "domino_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sleeps when nobody plays and wakes on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
