name: Release

# Publishes a version: runs every test, builds the APK signed with the release key,
# creates the GitHub Release "vX.Y.Z" with the APK attached, and publishes the
# server image tagged X.Y.Z, then redeploys the server through the Portainer webhook
# if one is set up. Start it from Actions → Release → Run workflow.
# One-time setup (signing secrets, webhook): docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 2.1.0
        required: true
      deploy:
        description: Update the server through the Portainer webhook
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          V="${VERSION#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 2.1.0 (got '$VERSION')"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::v$V has already been released"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Check the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets first (see docs/RELEASING.md)"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew --no-daemon :engine:test :server:test :app:testDebugUnitTest

      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          DOMINO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DOMINO_KEY_ALIAS: dominoes
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export DOMINO_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$DOMINO_KEYSTORE"
          ./gradlew --no-daemon :app:assembleRelease -PappVersion="$VERSION"
          rm -f "$DOMINO_KEYSTORE"
          cp app/build/outputs/apk/release/app-release.apk "dominoes-$VERSION.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Dominoes ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dominoes-${{ steps.version.outputs.version }}.apk
          body: |
            **Install:** download `dominoes-${{ steps.version.outputs.version }}.apk` below and open it on your phone.
            It installs over earlier releases; your games and stats are kept.

            **Server:** `ghcr.io/${{ github.repository_owner }}/domino-server:${{ steps.version.outputs.version }}`
            (in Portainer: update the stack with "Re-pull image", or let the webhook do it).

  server:
    needs: app
    uses: ./.github/workflows/server-image.yml
    with:
      version: ${{ needs.app.outputs.version }}
    secrets: inherit

  deploy:
    needs: [app, server]
    if: inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: gradle.properties
          sparse-checkout-cone-mode: false

      - name: Redeploy the server
        id: webhook
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::No PORTAINER_WEBHOOK_URL secret, so the server wasn't updated (see docs/RELEASING.md)"
            echo "called=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST --max-time 300 "$WEBHOOK") || code=000
          if [ "${code:0:1}" != 2 ]; then
            echo "::error::The Portainer webhook answered $code: $(head -c 500 response.txt 2>/dev/null)"; exit 1
          fi
          echo "called=true" >> "$GITHUB_OUTPUT"

      - name: Wait for the new version
        if: steps.webhook.outputs.called == 'true'
        env:
          VERSION: ${{ needs.app.outputs.version }}
        run: |
          SERVER=$(grep -E '^dominoServerUrl=' gradle.properties | cut -d= -f2-)
          for i in $(seq 1 30); do
            info=$(curl -fsS --max-time 10 "$SERVER/version" 2>/dev/null || true)
            if echo "$info" | grep -q "\"version\":\"$VERSION\""; then
              echo "$SERVER is running $VERSION: $info"; exit 0
            fi
            sleep 10
          done
          echo "::error::$SERVER doesn't report version $VERSION after 5 minutes (last answer: ${info:-none}). Check the stack in Portainer."
          exit 1
