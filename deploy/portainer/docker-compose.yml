# Portainer stack: the dominoes game server on its own.
# Runs behind Nginx Proxy Manager, which handles HTTPS: forward your domain to
# http://dominoes:8080 with WebSockets enabled. Steps: docs/ONLINE.md.
services:
  dominoes:
    image: ghcr.io/dwzg/domino-server:latest
    container_name: dominoes
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE: /data/domino.db
    volumes:
      - dominoes-data:/data

volumes:
  dominoes-data:
networks:
  default:
    name: nginx-proxy-network
    external: true
